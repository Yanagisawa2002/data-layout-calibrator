name: Pure functional CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functional-${{ github.ref }}
  cancel-in-progress: true

env:
  DLC_FUNCTIONAL_ONLY: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.302'
      - name: Install renderer model dependencies
        run: python -m pip install -r Tools/ResultRenderer/requirements.txt
      - name: Static metadata and Python compilation
        run: |
          python Tools/CI/check_repository.py
          python -m compileall -q Tools
      - name: Allowlisted CPU correctness and build checks
        run: python Tools/CI/validate_functional.py
      - name: Compile source generator
        run: dotnet build Packages/com.yanagisawa.data-layout-calibrator/SourceGenerators~/Yanagisawa.DataLayoutCalibrator.SourceGenerator.csproj -c Release --nologo
      - name: Pure source generator correctness
        run: dotnet test Packages/com.yanagisawa.data-layout-calibrator/SourceGenerators~/Tests/Yanagisawa.DataLayoutCalibrator.SourceGenerator.Tests.csproj -c Release --filter FullyQualifiedName~DataLayoutScaffoldGeneratorTests --nologo
      - name: Offline external source and input contracts
        run: python Tools/KernelContracts/external_sources.py
      - name: Whitespace check
        run: git diff --check "$(git merge-base origin/main HEAD)"...HEAD
      # Never invoke Unity, Player, old mixed ScientificTests, external workloads,
      # performance frameworks, calibration, autotuning, clocks or hardware counters.
